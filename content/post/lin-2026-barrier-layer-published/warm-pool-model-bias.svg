<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="wpTitle wpDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="wpTitle">How coupled models misplace the warm pool and thin the barrier layer</title>
  <desc id="wpDesc">Two equatorial Pacific cross-sections from west to east. In observations the warm pool extends far east, the barrier layer beneath it is thick, and the upper western Pacific is fresh under heavy rainfall with moderate easterly winds. In coupled models the warm pool eastern edge sits too far west, the barrier layer is too thin, rainfall is weaker and easterly winds are stronger, leaving the upper western Pacific too salty.</desc>
  <defs>
    <linearGradient id="wpWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be123c" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#e8637f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6bcc8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wpCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fc8dc"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <marker id="wpA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="wpAw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" rx="14" fill="#fcfcfb" stroke="#e2e8f0"/>

  <!-- ===================== PANEL A : OBSERVATIONS ===================== -->
  <g>
    <rect x="40" y="46" width="132" height="24" rx="6" fill="#0f172a"/>
    <text x="106" y="63" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">OBSERVATIONS</text>

    <!-- winds + rain -->
    <text x="196" y="63" font-size="12" font-weight="600" fill="#334155">heavy rainfall, moderate easterlies</text>
    <g stroke="#0891b2" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
      <line x1="220" y1="82" x2="216" y2="98"/><line x1="252" y1="86" x2="248" y2="102"/>
      <line x1="284" y1="80" x2="280" y2="96"/><line x1="316" y1="88" x2="312" y2="104"/>
      <line x1="348" y1="82" x2="344" y2="98"/><line x1="380" y1="86" x2="376" y2="102"/>
      <line x1="412" y1="80" x2="408" y2="96"/><line x1="444" y1="88" x2="440" y2="104"/>
      <line x1="476" y1="84" x2="472" y2="100"/><line x1="508" y1="80" x2="504" y2="96"/>
    </g>
    <line x1="700" y1="92" x2="600" y2="92" stroke="#0f172a" stroke-width="2.6" marker-end="url(#wpAw)"/>
    <text x="712" y="96" font-size="11.5" fill="#334155">easterlies</text>

    <!-- ocean -->
    <rect x="120" y="114" width="740" height="112" fill="url(#wpCool)"/>
    <path d="M120 114 H636 V150 H120 Z" fill="url(#wpWarm)"/>
    <rect x="120" y="150" width="516" height="34" fill="#d97706" opacity="0.85"/>
    <line x1="120" y1="114" x2="860" y2="114" stroke="#0f172a" stroke-width="2"/>

    <text x="134" y="138" font-size="12.5" font-weight="700" fill="#ffffff">WARM POOL</text>
    <text x="134" y="172" font-size="12.5" font-weight="700" fill="#4a2603">THICK BARRIER LAYER</text>
    <text x="680" y="176" font-size="12.5" font-weight="700" fill="#ffffff">cold tongue</text>
    <rect x="130" y="196" width="150" height="22" rx="11" fill="#6d28d9"/>
  <text x="205" y="211" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">fresh upper ocean</text>

    <line x1="636" y1="100" x2="636" y2="232" stroke="#0f172a" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="636" cy="114" r="6" fill="#0f172a"/>
    <text x="648" y="248" font-size="12.5" font-weight="700" fill="#0f172a">warm pool eastern edge</text>
  </g>

  <!-- ===================== PANEL B : MODELS ===================== -->
  <g>
    <rect x="40" y="306" width="150" height="24" rx="6" fill="#6d28d9"/>
    <text x="115" y="323" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">COUPLED MODELS</text>

    <text x="214" y="323" font-size="12" font-weight="600" fill="#334155">weaker rainfall, stronger easterlies</text>
    <g stroke="#0891b2" stroke-width="2.2" stroke-linecap="round" opacity="0.65">
      <line x1="236" y1="342" x2="232" y2="356"/><line x1="300" y1="346" x2="296" y2="360"/>
      <line x1="364" y1="342" x2="360" y2="356"/><line x1="428" y1="346" x2="424" y2="360"/>
    </g>
    <line x1="760" y1="352" x2="600" y2="352" stroke="#0f172a" stroke-width="4" marker-end="url(#wpAw)"/>
    <text x="772" y="356" font-size="11.5" font-weight="700" fill="#334155">stronger</text>

    <rect x="120" y="374" width="740" height="112" fill="url(#wpCool)"/>
    <path d="M120 374 H486 V410 H120 Z" fill="url(#wpWarm)"/>
    <rect x="120" y="410" width="366" height="16" fill="#d97706" opacity="0.85"/>
    <line x1="120" y1="374" x2="860" y2="374" stroke="#0f172a" stroke-width="2"/>

    <text x="134" y="398" font-size="12.5" font-weight="700" fill="#ffffff">WARM POOL</text>
    <text x="134" y="423" font-size="11" font-weight="700" fill="#4a2603">THIN BARRIER LAYER</text>
    <text x="620" y="436" font-size="12.5" font-weight="700" fill="#ffffff">cold tongue reaches too far west</text>
    <rect x="130" y="448" width="176" height="22" rx="11" fill="#6d28d9"/>
  <text x="218" y="463" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">upper ocean too salty</text>
  <text x="316" y="463" font-size="12" font-weight="700" fill="#5b21b6">— the root of the bias</text>

    <line x1="486" y1="360" x2="486" y2="492" stroke="#6d28d9" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="486" cy="374" r="6" fill="#6d28d9"/>

    <!-- the displacement, stated explicitly and not by colour alone -->
    <line x1="492" y1="508" x2="630" y2="508" stroke="#334155" stroke-width="2.2" marker-end="url(#wpA)"/>
    <line x1="636" y1="492" x2="636" y2="516" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="482" y="512" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="end">modelled edge sits too far west</text>
    <text x="644" y="512" font-size="11.5" fill="#64748b">observed position</text>
  </g>

  <!-- axis -->
  <text x="120" y="536" font-size="11.5" font-weight="600" fill="#64748b">western Pacific</text>
  <text x="860" y="536" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="end">eastern Pacific</text>
  <line x1="120" y1="524" x2="860" y2="524" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="860" y="36" font-size="11" fill="#94a3b8" text-anchor="end">Conceptual — not to scale.</text>
</svg>
