<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    header {
      border-bottom: 2px solid #eee;
      margin-bottom: 1.5rem;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0366d6;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <h1>Welcome</h1>
    <p>A simple homepage</p>

    <nav>
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>
        This is a simple homepage built with plain HTML.
      </p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>
        Email: yourname@example.com
      </p>
    </section>
  </main>

  <footer>
    <hr>
    <p>© 2026 Your Name</p>
  </footer>
</body>
</html>
