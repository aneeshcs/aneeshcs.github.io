name: Deploy website to GitHub Pages

env:
  NODE_VERSION: '24'

on:
  # Trigger the workflow every time you push to the `master` branch
  push:
    branches: ['master']
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@v6

    - name: Get Hugo Version
      id: hugo-version
      run: |
        VERSION=$(grep "hugo_version" hugoblox.yaml | awk '{print $2}' | tr -d "'\"")
        echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        # Install Tailwind CLI if package.json exists
        if [ -f "package.json" ]; then
          echo "Installing Tailwind dependencies..."
          pnpm install --no-frozen-lockfile || npm install
        fi

    - name: Setup Hugo
      run: |
        curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
          | tar -xz -C /usr/local/bin hugo

      # Cache dependencies (Go modules, node_modules) - stable, rarely changes
    - uses: actions/cache@v5
      with:
        path: |
          /tmp/hugo_cache_runner/
          node_modules/
          modules/*/node_modules/
        key: ${{ runner.os }}-hugo-deps-${{ hashFiles('**/go.mod', '**/package-lock.json',
          '**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-hugo-deps-

      # Cache Hugo resources (processed images, CSS) - invalidates only when assets/config change
    - uses: actions/cache@v5
      with:
        path: resources/
        key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*',
          'hugo.yaml', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-hugo-resources-

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Export marimo notebooks
      run: |
        uvx marimo export html-wasm --sandbox --mode run --no-show-code \
          notebooks/twodnavierstokes.py \
          -o static/gfd/twodnavierstokes.html
        uvx marimo export html-wasm --sandbox --mode run --no-show-code \
          notebooks/rayleighbenard.py \
          -o static/gfd/rayleighbenard.html
        uvx marimo export html-wasm --sandbox --mode run --no-show-code \
          notebooks/shallowwater.py \
          -o static/gfd/shallowwater.html
        uvx marimo export html-wasm --sandbox --mode run --no-show-code \
          notebooks/internalwaves.py \
          -o static/gfd/internalwaves.html

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
        HUGO_BLOX_LICENSE: ${{ secrets.HUGO_BLOX_LICENSE }}
      run: |
        echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

    - name: Generate Pagefind search index (if applicable)
      run: |
        # Check if site uses Pagefind search
        if [ -f "package.json" ] && grep -q "pagefind" package.json; then
          pnpm run pagefind || npx pagefind --site "public"
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./public

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
