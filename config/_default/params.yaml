hugoblox:
  schema: "2.0"
  identity:
    name: CHAOS & Predictability @ CUB
    type: organization
    tagline: CHAOS and Predictability @ CU Boulder
    description: Our group aims to advance the fundamental understanding of climate processes in the earth system in order to improve weather and climate predictions.
  theme:
    mode: system
    pack: minimal
    colors:
      primary: ""
      secondary: ""
      neutral: ""
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
