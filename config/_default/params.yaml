hugoblox:
  schema: "2.0"
  identity:
    name: CHAOS & Predictability @ CUB
    type: organization
    tagline: CHAOS and Predictability @ CU Boulder
    description: Our group advances fundamental understanding of hydroclimate, atmosphere, and ocean processes and their interactions to understand Earth system predictability and improve predictions across timescales.
  theme:
    mode: system
    pack: minimal
    colors:
      primary: ""
      secondary: ""
      neutral: ""
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
