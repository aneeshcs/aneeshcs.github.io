bio: "Co-mentored by Aneesh Subramanian and Kristopher Karnauskas. PhD in Atmospheric Sciences from National Taiwan University (2022), with a visiting period at SUNY Albany, followed by a postdoctoral position at NASA GISS and Columbia University working on ModelE3 sea surface temperature Green's functions and cloud radiative feedback. Research spans air-sea interaction, ocean modulation of climate feedbacks, Atlantic Meridional Overturning Circulation dynamics under warming, and salinity-driven barrier layers in the tropical Pacific."
