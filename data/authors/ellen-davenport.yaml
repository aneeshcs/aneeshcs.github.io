bio: "PhD in Oceanography from Scripps Institution of Oceanography, UC San Diego (2026), with an MS in Electrical and Computer Engineering from UC San Diego and four years as an embedded software engineer at Sarcos Robotics between a Dartmouth College engineering degree and graduate school. Works on the ONR SAFARI project, using machine learning to understand the ocean's role in the development of North Pacific atmospheric rivers; research spans ocean data assimilation, inverse problems, tropical Pacific dynamics, and differentiable Earth system modeling."
