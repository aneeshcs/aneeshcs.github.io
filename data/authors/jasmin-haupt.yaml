bio: "Doctoral researcher in the Meteorological Data Science group at the Karlsruhe Institute of Technology, working on tropical atmospheric dynamics through a combination of process-based modelling and machine learning. Her master's thesis examined the influence of sea surface temperature on the land-sea breeze along the Guinea Coast using sensitivity experiments with the ICON model. During her visit she is hosted jointly by the group at CU Boulder and by the Atmosphere-Ocean Processes and Predictability Lab at NOAA PSL."
